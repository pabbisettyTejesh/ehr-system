<div class="auth-wrap">
  <div class="auth-card card">
    <div class="auth-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <span class="page-eyebrow">EHR System</span>
    <h2>Sign in</h2>
    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required>
      </div>
      <div class="error-text" *ngIf="error">{{ error }}</div>
      <button class="btn" type="submit" [disabled]="loading" style="width:100%; justify-content:center; margin-top:6px;">
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
    <p class="auth-footnote">
      New patient? <a routerLink="/register/patient">Register here</a><br>
      New doctor? <a routerLink="/register/doctor">Register here</a>
    </p>
  </div>
</div>
