<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img">
  <title>Digital medical record with clinical timeline</title>
  <defs>
    <linearGradient id="mrBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <filter id="mrShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="130" rx="150" ry="110" fill="url(#mrBlob)"/>

  <g filter="url(#mrShadow)">
    <path d="M96 50h96l32 32v128a10 10 0 0 1 -10 10H96a10 10 0 0 1 -10-10V60a10 10 0 0 1 10-10z" fill="#FFFFFF"/>
    <path d="M192 50l32 32h-22a10 10 0 0 1 -10-10z" fill="#DBEAFE"/>
    <rect x="106" y="96" width="90" height="8" rx="4" fill="#2563EB"/>
    <rect x="106" y="114" width="110" height="6" rx="3" fill="#DBEAFE"/>
    <rect x="106" y="128" width="80" height="6" rx="3" fill="#DBEAFE"/>
    <polyline points="106,166 122,166 130,148 140,182 150,158 158,166 216,166" fill="none" stroke="#14B8A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="106" y="188" width="70" height="6" rx="3" fill="#8B5CF6" opacity="0.55"/>
  </g>

  <!-- magnifier -->
  <g filter="url(#mrShadow)">
    <circle cx="232" cy="182" r="24" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <circle cx="232" cy="182" r="24" fill="none" stroke="#2563EB" stroke-width="6"/>
    <line x1="249" y1="199" x2="266" y2="216" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="249" y1="199" x2="266" y2="216" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
  </g>

  <circle cx="60" cy="180" r="7" fill="#8B5CF6" opacity="0.45"/>
  <circle cx="250" cy="70" r="6" fill="#14B8A6" opacity="0.45"/>
</svg>
