spring.application.name=ehr-backend

# ---- Database (MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/ehr_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ---- JWT ----
app.jwt.secret=change-this-super-secret-key-before-deploying-to-production-min-32-bytes
app.jwt.expiration-ms=86400000

# ---- Server ----
server.port=8080

# ---- File upload (Level 2 report upload, optional) ----
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
