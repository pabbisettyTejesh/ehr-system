<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img">
  <title>Person securely signing in to the healthcare portal</title>
  <defs>
    <linearGradient id="loginBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <linearGradient id="loginBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F9488"/>
    </linearGradient>
    <filter id="loginShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2563EB" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="210" cy="190" rx="190" ry="170" fill="url(#loginBlob)"/>
  <ellipse cx="210" cy="352" rx="130" ry="12" fill="#1E293B" opacity="0.06"/>

  <!-- desk -->
  <rect x="90" y="290" width="240" height="14" rx="7" fill="#DBEAFE"/>

  <!-- laptop -->
  <g filter="url(#loginShadow)">
    <path d="M150 210h120l14 78H136z" fill="#FFFFFF"/>
    <rect x="150" y="210" width="120" height="70" rx="6" fill="#EFF6FF"/>
    <rect x="164" y="224" width="92" height="8" rx="4" fill="#2563EB"/>
    <rect x="164" y="240" width="70" height="6" rx="3" fill="#DBEAFE"/>
    <rect x="164" y="252" width="50" height="6" rx="3" fill="#DBEAFE"/>
    <rect x="118" y="288" width="164" height="10" rx="5" fill="#DBEAFE"/>
  </g>

  <!-- person seated -->
  <g filter="url(#loginShadow)">
    <rect x="168" y="150" width="84" height="110" rx="34" fill="url(#loginBody)"/>
    <circle cx="210" cy="118" r="34" fill="#FFFFFF"/>
    <path d="M176 118a34 34 0 0 1 68 0v8h-68z" fill="#1E293B" opacity="0.85"/>
  </g>

  <!-- shield lock badge floating above laptop -->
  <g filter="url(#loginShadow)">
    <path d="M292 150c0-6 26-14 26-14s26 8 26 14c0 22-11 36-26 41-15-5-26-19-26-41z" fill="#2563EB"/>
    <rect x="306" y="163" width="24" height="19" rx="4" fill="#FFFFFF"/>
    <path d="M310 163v-7a8 8 0 0 1 16 0v7" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="318" cy="172" r="2.6" fill="#2563EB"/>
  </g>

  <circle cx="80" cy="110" r="8" fill="#8B5CF6" opacity="0.5"/>
  <circle cx="350" cy="240" r="10" fill="#14B8A6" opacity="0.4"/>
</svg>
