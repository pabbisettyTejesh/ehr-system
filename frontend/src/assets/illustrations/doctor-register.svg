<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" role="img">
  <title>Doctor registration and professional verification illustration</title>
  <defs>
    <linearGradient id="drBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="drCoat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="drShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2563EB" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="190" cy="170" rx="170" ry="150" fill="url(#drBlob)"/>
  <ellipse cx="190" cy="312" rx="120" ry="11" fill="#1E293B" opacity="0.06"/>

  <!-- doctor figure -->
  <g filter="url(#drShadow)">
    <rect x="126" y="138" width="94" height="132" rx="38" fill="url(#drCoat)"/>
    <rect x="152" y="138" width="42" height="96" rx="14" fill="#DBEAFE"/>
    <circle cx="173" cy="104" r="34" fill="#FFFFFF"/>
    <path d="M139 104a34 34 0 0 1 68 0v8h-68z" fill="#1E293B" opacity="0.85"/>
  </g>

  <!-- stethoscope -->
  <path d="M148 170c0 24 8 36 26 36s26-12 26-36" fill="none" stroke="#14B8A6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="174" cy="206" r="7" fill="#14B8A6"/>

  <!-- verification badge -->
  <g filter="url(#drShadow)">
    <path d="M244 90c0-7 30-16 30-16s30 9 30 16c0 24-13 39-30 44-17-5-30-20-30-44z" fill="#FFFFFF"/>
    <path d="M259 113l10 9 17-19" fill="none" stroke="#14B8A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- credential card -->
  <g filter="url(#drShadow)">
    <rect x="222" y="176" width="120" height="80" rx="12" fill="#FFFFFF"/>
    <circle cx="248" cy="202" r="13" fill="#DBEAFE"/>
    <path d="M240 206a8 8 0 0 1 16 0v2a8 8 0 0 1 -16 0z" fill="#2563EB"/>
    <rect x="270" y="194" width="58" height="6" rx="3" fill="#1E293B" opacity="0.7"/>
    <rect x="270" y="206" width="42" height="5" rx="2.5" fill="#DBEAFE"/>
    <rect x="234" y="228" width="94" height="5" rx="2.5" fill="#DBEAFE"/>
    <rect x="234" y="239" width="60" height="5" rx="2.5" fill="#8B5CF6" opacity="0.6"/>
  </g>

  <circle cx="80" cy="230" r="8" fill="#8B5CF6" opacity="0.45"/>
  <circle cx="330" cy="120" r="6" fill="#14B8A6" opacity="0.45"/>
</svg>
