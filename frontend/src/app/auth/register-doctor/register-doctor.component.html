<div class="auth-wrap" style="align-items:flex-start; padding-top:48px;">
  <div class="auth-illustration" style="flex-basis:260px;">
    <img src="assets/illustrations/doctor-register.svg" alt="Doctor registration and professional verification illustration" width="380" height="340" loading="eager" style="max-width:260px;">
  </div>
  <div class="auth-card card" style="max-width:560px;">
    <span class="page-eyebrow">EHR System</span>
    <h2>Doctor Registration</h2>
    <form (ngSubmit)="submit()">
      <div class="grid-2">
        <div class="form-group">
          <label>Full Name</label>
          <input [(ngModel)]="form.fullName" name="fullName" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="form.email" name="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="form.password" name="password" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input [(ngModel)]="form.phone" name="phone">
        </div>
        <div class="form-group">
          <label>Specialization</label>
          <input [(ngModel)]="form.specialization" name="specialization">
        </div>
        <div class="form-group">
          <label>License Number</label>
          <input [(ngModel)]="form.licenseNumber" name="licenseNumber">
        </div>
        <div class="form-group">
          <label>Qualification</label>
          <input [(ngModel)]="form.qualification" name="qualification">
        </div>
        <div class="form-group">
          <label>Experience (years)</label>
          <input type="number" [(ngModel)]="form.experienceYears" name="experienceYears">
        </div>
      </div>
      <div class="form-group">
        <label>Default Hospital/Clinic Name</label>
        <input [(ngModel)]="form.defaultHospitalName" name="defaultHospitalName">
      </div>
      <div class="error-text" *ngIf="error">{{ error }}</div>
      <div class="success-text" *ngIf="success">{{ success }}</div>
      <button class="btn" type="submit" [disabled]="loading" style="width:100%; justify-content:center; margin-top:6px;">
        {{ loading ? 'Registering…' : 'Register' }}
      </button>
    </form>
    <p class="auth-footnote">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
