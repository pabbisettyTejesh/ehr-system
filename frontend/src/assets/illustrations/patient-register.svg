<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" role="img">
  <title>Patient registration and profile onboarding illustration</title>
  <defs>
    <linearGradient id="prBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <linearGradient id="prBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="prShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2563EB" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="190" cy="170" rx="170" ry="150" fill="url(#prBlob)"/>
  <ellipse cx="190" cy="312" rx="120" ry="11" fill="#1E293B" opacity="0.06"/>

  <!-- patient figure -->
  <g filter="url(#prShadow)">
    <rect x="128" y="140" width="90" height="130" rx="36" fill="url(#prBody)"/>
    <circle cx="173" cy="106" r="34" fill="#FFFFFF"/>
    <path d="M139 106a34 34 0 0 1 68 0v8h-68z" fill="#1E293B" opacity="0.85"/>
  </g>

  <!-- ID card being handed over -->
  <g filter="url(#prShadow)">
    <rect x="222" y="150" width="118" height="82" rx="12" fill="#FFFFFF"/>
    <circle cx="248" cy="176" r="14" fill="#DBEAFE"/>
    <path d="M240 180a8 8 0 0 1 16 0v3a8 8 0 0 1 -16 0z" fill="#2563EB"/>
    <rect x="270" y="168" width="56" height="6" rx="3" fill="#1E293B" opacity="0.7"/>
    <rect x="270" y="180" width="40" height="5" rx="2.5" fill="#DBEAFE"/>
    <rect x="234" y="202" width="92" height="5" rx="2.5" fill="#DBEAFE"/>
    <rect x="234" y="213" width="70" height="5" rx="2.5" fill="#DBEAFE"/>
  </g>

  <!-- plus badge: new profile -->
  <g filter="url(#prShadow)">
    <circle cx="298" cy="120" r="24" fill="#8B5CF6"/>
    <path d="M298 110v20M288 120h20" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <circle cx="70" cy="90" r="8" fill="#2563EB" opacity="0.45"/>
  <circle cx="90" cy="250" r="7" fill="#14B8A6" opacity="0.4"/>
</svg>
