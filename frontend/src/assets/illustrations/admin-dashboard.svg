<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img">
  <title>Healthcare administration control center with analytics and access control</title>
  <defs>
    <linearGradient id="adBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="adShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6D28D9" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="210" cy="150" rx="200" ry="130" fill="url(#adBlob)"/>

  <!-- monitor -->
  <g filter="url(#adShadow)">
    <rect x="110" y="70" width="200" height="140" rx="14" fill="#FFFFFF"/>
    <rect x="126" y="86" width="80" height="9" rx="4.5" fill="#8B5CF6"/>
    <rect x="126" y="102" width="120" height="6" rx="3" fill="#DBEAFE"/>

    <!-- bar chart -->
    <rect x="126" y="150" width="16" height="40" rx="4" fill="#2563EB"/>
    <rect x="150" y="130" width="16" height="60" rx="4" fill="#14B8A6"/>
    <rect x="174" y="160" width="16" height="30" rx="4" fill="#8B5CF6"/>
    <rect x="198" y="140" width="16" height="50" rx="4" fill="#2563EB" opacity="0.6"/>

    <!-- donut -->
    <circle cx="262" cy="160" r="34" fill="none" stroke="#DBEAFE" stroke-width="12"/>
    <path d="M262 126a34 34 0 0 1 24 58" fill="none" stroke="#8B5CF6" stroke-width="12" stroke-linecap="round"/>
    <path d="M262 126a34 34 0 0 0 -28 52" fill="none" stroke="#14B8A6" stroke-width="12" stroke-linecap="round"/>
  </g>
  <rect x="192" y="210" width="36" height="14" fill="#DBEAFE"/>
  <rect x="160" y="224" width="100" height="10" rx="5" fill="#DBEAFE"/>

  <!-- shield/access badge -->
  <g filter="url(#adShadow)">
    <path d="M330 178c0-6 24-13 24-13s24 7 24 13c0 20-11 33-24 37-13-4-24-17-24-37z" fill="#2563EB"/>
    <path d="M342 197l8 7 13-15" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- users badge -->
  <g filter="url(#adShadow)">
    <circle cx="66" cy="90" r="26" fill="#FFFFFF"/>
    <circle cx="58" cy="84" r="7" fill="#14B8A6"/>
    <circle cx="74" cy="84" r="7" fill="#8B5CF6"/>
    <path d="M48 100c1-8 7-12 10-12s3 0 0 0c3 0 9 4 10 12" fill="#14B8A6"/>
    <path d="M64 100c1-8 7-12 10-12s3 0 0 0c3 0 9 4 10 12" fill="#8B5CF6"/>
  </g>

  <circle cx="70" cy="220" r="8" fill="#2563EB" opacity="0.35"/>
  <circle cx="360" cy="120" r="6" fill="#14B8A6" opacity="0.4"/>
</svg>
