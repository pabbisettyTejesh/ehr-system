spring.application.name=ehr-backend

# ---- Database (MySQL) ----
# Local dev falls back to localhost/root/tejesh. On Railway, attach a MySQL
# plugin and it auto-injects MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD,
# which override these defaults automatically -- no manual wiring needed.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ehr_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:tejesh}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ---- JWT ----
# Set JWT_SECRET as a real env var in Railway -- do not rely on this fallback in production.
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-before-deploying-to-production-min-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Server ----
# Railway injects PORT at runtime; 8080 is only used for local dev.
server.port=${PORT:8080}

# ---- CORS ----
# Comma-separated list of allowed frontend origins (no wildcard in production).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# ---- Default admin seed (override in production via env vars) ----
app.seed.admin-email=${ADMIN_EMAIL:admin@ehr.com}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}

# ---- File upload (Level 2 report upload, optional) ----
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
