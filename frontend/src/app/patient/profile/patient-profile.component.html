<div class="container" style="max-width: 600px;">
  <h1>My Profile</h1>
  <div class="card" *ngIf="profile">
    <p><strong>Patient UID:</strong> <span class="uid">{{ profile.patientUid }}</span></p>
    <div class="form-group">
      <label>Full Name</label>
      <input [(ngModel)]="profile.fullName" name="fullName">
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Gender</label>
        <input [(ngModel)]="profile.gender" name="gender">
      </div>
      <div class="form-group">
        <label>Blood Group</label>
        <input [(ngModel)]="profile.bloodGroup" name="bloodGroup">
      </div>
    </div>
    <div class="form-group">
      <label>Address</label>
      <input [(ngModel)]="profile.address" name="address">
    </div>
    <div class="form-group">
      <label>City</label>
      <input [(ngModel)]="profile.city" name="city">
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Emergency Contact Name</label>
        <input [(ngModel)]="profile.emergencyContactName" name="emergencyContactName">
      </div>
      <div class="form-group">
        <label>Emergency Contact Phone</label>
        <input [(ngModel)]="profile.emergencyContactPhone" name="emergencyContactPhone">
      </div>
    </div>
    <button class="btn" (click)="save()" [disabled]="saving">{{ saving ? 'Saving...' : 'Save Changes' }}</button>
    <p class="success-text" *ngIf="message">{{ message }}</p>
  </div>
  <div class="card" *ngIf="!profile">Loading...</div>
</div>
