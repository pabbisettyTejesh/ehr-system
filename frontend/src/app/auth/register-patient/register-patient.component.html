<div class="auth-wrap" style="align-items:flex-start; padding-top:48px;">
  <div class="auth-illustration" style="flex-basis:260px;">
    <img src="assets/illustrations/patient-register.svg" alt="Patient registration and profile onboarding illustration" width="380" height="340" loading="eager" style="max-width:260px;">
  </div>
  <div class="auth-card card" style="max-width:560px;">
    <span class="page-eyebrow">EHR System</span>
    <h2>Patient Registration</h2>
    <form (ngSubmit)="submit()">
      <div class="grid-2">
        <div class="form-group">
          <label>Full Name</label>
          <input [(ngModel)]="form.fullName" name="fullName" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="form.email" name="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="form.password" name="password" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input [(ngModel)]="form.phone" name="phone">
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" [(ngModel)]="form.dateOfBirth" name="dateOfBirth">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select [(ngModel)]="form.gender" name="gender">
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Blood Group</label>
          <input [(ngModel)]="form.bloodGroup" name="bloodGroup" placeholder="e.g. B+">
        </div>
        <div class="form-group">
          <label>City</label>
          <input [(ngModel)]="form.city" name="city">
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea [(ngModel)]="form.address" name="address" rows="2"></textarea>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Emergency Contact Name</label>
          <input [(ngModel)]="form.emergencyContactName" name="emergencyContactName">
        </div>
        <div class="form-group">
          <label>Emergency Contact Phone</label>
          <input [(ngModel)]="form.emergencyContactPhone" name="emergencyContactPhone">
        </div>
      </div>
      <div class="error-text" *ngIf="error">{{ error }}</div>
      <div class="success-text" *ngIf="success">{{ success }}</div>
      <button class="btn" type="submit" [disabled]="loading" style="width:100%; justify-content:center; margin-top:6px;">
        {{ loading ? 'Registering…' : 'Register' }}
      </button>
    </form>
    <p class="auth-footnote">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
