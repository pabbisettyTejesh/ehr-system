<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img">
  <title>Doctor reviewing appointed patients at a clinical workspace</title>
  <defs>
    <linearGradient id="ddBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="ddCoat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="ddShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="210" cy="150" rx="200" ry="130" fill="url(#ddBlob)"/>

  <!-- desk -->
  <rect x="60" y="248" width="300" height="14" rx="7" fill="#DBEAFE"/>

  <!-- doctor figure -->
  <g filter="url(#ddShadow)">
    <rect x="110" y="130" width="96" height="130" rx="38" fill="url(#ddCoat)"/>
    <rect x="136" y="130" width="44" height="94" rx="14" fill="#DBEAFE"/>
    <circle cx="158" cy="96" r="34" fill="#FFFFFF"/>
    <path d="M124 96a34 34 0 0 1 68 0v8h-68z" fill="#1E293B" opacity="0.85"/>
  </g>
  <path d="M134 160c0 22 8 34 24 34s24-12 24-34" fill="none" stroke="#14B8A6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="158" cy="194" r="6.5" fill="#14B8A6"/>

  <!-- tablet in hand -->
  <g filter="url(#ddShadow)">
    <rect x="210" y="168" width="86" height="64" rx="10" fill="#FFFFFF"/>
    <rect x="220" y="178" width="50" height="6" rx="3" fill="#2563EB"/>
    <rect x="220" y="190" width="66" height="5" rx="2.5" fill="#DBEAFE"/>
    <rect x="220" y="200" width="50" height="5" rx="2.5" fill="#DBEAFE"/>
    <rect x="220" y="212" width="34" height="5" rx="2.5" fill="#14B8A6" opacity="0.6"/>
  </g>

  <!-- patient list card -->
  <g filter="url(#ddShadow)">
    <rect x="290" y="70" width="112" height="90" rx="12" fill="#FFFFFF"/>
    <circle cx="312" cy="92" r="9" fill="#8B5CF6" opacity="0.25"/>
    <rect x="328" y="88" width="56" height="6" rx="3" fill="#1E293B" opacity="0.65"/>
    <circle cx="312" cy="116" r="9" fill="#14B8A6" opacity="0.25"/>
    <rect x="328" y="112" width="56" height="6" rx="3" fill="#DBEAFE"/>
    <circle cx="312" cy="140" r="9" fill="#2563EB" opacity="0.2"/>
    <rect x="328" y="136" width="56" height="6" rx="3" fill="#DBEAFE"/>
  </g>

  <circle cx="60" cy="90" r="8" fill="#2563EB" opacity="0.4"/>
  <circle cx="380" cy="220" r="7" fill="#14B8A6" opacity="0.4"/>
</svg>
