<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img">
  <title>Loading medical data</title>
  <defs>
    <style>
      .pulse-line { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.6s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 220; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -220; } }
      .pulse-dot { animation: fade 1.6s ease-in-out infinite; }
      @keyframes fade { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <circle cx="100" cy="60" r="46" fill="#DBEAFE" opacity="0.6"/>
  <polyline class="pulse-line" points="30,60 60,60 70,38 84,84 96,50 106,60 130,60 140,44 150,60 170,60"
    fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="pulse-dot" cx="100" cy="102" r="4" fill="#14B8A6"/>
  <circle class="pulse-dot" cx="86" cy="102" r="4" fill="#8B5CF6" style="animation-delay:0.2s"/>
  <circle class="pulse-dot" cx="114" cy="102" r="4" fill="#8B5CF6" style="animation-delay:0.4s"/>
</svg>
