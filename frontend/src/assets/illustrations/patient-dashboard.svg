<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img">
  <title>Patient viewing their personal health record on a phone</title>
  <defs>
    <linearGradient id="pdBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <linearGradient id="pdBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="pdShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="210" cy="150" rx="200" ry="130" fill="url(#pdBlob)"/>

  <!-- patient figure, relaxed -->
  <g filter="url(#pdShadow)">
    <rect x="120" y="120" width="100" height="140" rx="40" fill="url(#pdBody)"/>
    <circle cx="170" cy="88" r="36" fill="#FFFFFF"/>
    <path d="M134 88a36 36 0 0 1 72 0v9h-72z" fill="#1E293B" opacity="0.85"/>
  </g>

  <!-- phone with pulse -->
  <g filter="url(#pdShadow)">
    <rect x="196" y="150" width="70" height="120" rx="16" fill="#FFFFFF"/>
    <rect x="204" y="164" width="54" height="78" rx="6" fill="#EFF6FF"/>
    <polyline points="208,206 218,206 224,190 232,218 240,196 246,206 254,206" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="231" cy="255" r="6" fill="#DBEAFE"/>
  </g>

  <!-- floating stat cards -->
  <g filter="url(#pdShadow)">
    <rect x="270" y="70" width="120" height="64" rx="12" fill="#FFFFFF"/>
    <circle cx="294" cy="96" r="12" fill="#8B5CF6" opacity="0.18"/>
    <path d="M288 96a6 6 0 0 1 12 0v8a6 6 0 0 1 -12 0z" fill="#8B5CF6"/>
    <rect x="312" y="88" width="60" height="7" rx="3.5" fill="#1E293B" opacity="0.7"/>
    <rect x="312" y="102" width="40" height="5" rx="2.5" fill="#DBEAFE"/>
  </g>
  <g filter="url(#pdShadow)">
    <rect x="30" y="180" width="112" height="62" rx="12" fill="#FFFFFF"/>
    <circle cx="53" cy="205" r="11" fill="#14B8A6" opacity="0.2"/>
    <path d="M47 205a6 6 0 0 1 12 0v3a6 6 0 0 1 -12 0z" fill="#14B8A6"/>
    <rect x="70" y="198" width="56" height="6" rx="3" fill="#1E293B" opacity="0.7"/>
    <rect x="70" y="210" width="38" height="5" rx="2.5" fill="#DBEAFE"/>
  </g>

  <circle cx="360" cy="220" r="9" fill="#2563EB" opacity="0.4"/>
  <circle cx="60" cy="120" r="7" fill="#8B5CF6" opacity="0.4"/>
</svg>
